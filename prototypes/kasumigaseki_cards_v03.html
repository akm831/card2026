</style></head><body><div class="wrap"><header><div><div class="eyebrow">KASUMIGASEKI / CARD BATTLE PROTOTYPE 03</div><h1>政局の手札</h1></div><div class="bar"><button class="btn" onclick="showHelp()">遊び方</button><button class="btn" onclick="openCollection()">デッキ・所持カード</button><button class="btn" onclick="confirmReset()">最初から</button></div></header><main id="app"></main><footer>歴史案件を着想源にした架空の政治カードゲームです。人物・組織・事件の組み合わせは創作で、実在の案件に不正があったと示すものではありません。<br>HTML単体で動作します。保存できる環境では進行状況をブラウザに自動保存します。数値は試作用です。</footer></div><dialog id="help"></dialog><dialog id="collection"></dialog>
<script>

const CARDS={

 precision:{name:'精密な調査報告',cost:1,type:'攻撃・資料',kind:'attack',desc:'6ダメージ。1枚引く。',atk:6,draw:1,tag:'data'},
 secretary:{name:'相沢 凪',cost:1,type:'人物・議員',kind:'person',role:'調整役の秘書官出身',desc:'次ターンから、毎ターン開始時に1枚多く引く。',ability:'secretary'},
 scoop:{name:'調査報道',cost:1,type:'対抗・資料',desc:'7ダメージ。相手に裏人脈があれば12ダメージ。',atk:7,noirAtk:12,tag:'data'}
};
const STAGES=[
 {name:'夢の超特急',sub:'政策戦 / 計画の事業審査',enemy:'計画審査チーム',role:'「需要と実現性を示してください」',hp:44,ally:'expert',intro:'新しい幹線鉄道の構想を、実現できる計画として認めさせる。協力者を展開し、予告された追及をしのごう。',actions:[['需要への疑問',7,0,null],['技術面の追及',9,0,null],['予算の精査',5,5,null],['慎重審議',0,9,null],['計画の再検討',12,0,null],['協力者への圧力',5,0,'remove'],['需要への疑問',7,0,null],['追加説明の要求',8,0,null]]},
 {name:'都市の激戦区',sub:'選挙戦 / 与党選対本部',enemy:'対立候補の選挙陣営',role:'「その計画で、暮らしは変わるのか」',hp:48,ally:'media',intro:'政策審査で得た実績を訴え、支持を獲得する。勝利後、4種類の支持基盤から選べる。',actions:[['対立候補の街頭演説',8,0,null],['テレビでの批判',10,0,null],['支持組織の動員',5,5,null],['候補者への攻勢',7,0,'remove'],['公約比較',6,3,null],['不正疑惑の追及',7,0,'audit'],['最後の訴え',12,0,null],['支持組織の動員',5,5,null]]},
 {name:'予算を通せ',sub:'政策戦 / 最終予算協議',enemy:'慎重派の予算調整チーム',role:'「財源と優先順位を詰めましょう」',hp:55,ally:'noir',intro:'選挙で獲得した支持基盤を生かし、最終協議へ。相手の裏人脈を退場させるか、本体を攻めるかを選ぼう。',actions:[['財源不足の指摘',9,0,null],['要求額の圧縮',7,6,null],['追加査定',11,0,null],['協力者への圧力',6,0,'remove'],['慎重審議',0,12,null],['不正疑惑の追及',8,0,'audit'],['最終査定',14,0,null],['要求額の圧縮',7,6,null]]}
];
const ENEMY_ALLIES={expert:{name:'慎重な専門委員',desc:'毎ターン、相手にブロック2。',block:2},media:{name:'対立陣営の広報参謀',desc:'相手の攻撃に＋2。',boost:2},noir:{name:'利権の仲介人',desc:'相手の攻撃に＋3。不正の追及で退場できる。',boost:3,noir:true}};
const SUPPORTS={city:{name:'都市の支持基盤',desc:'毎ターン最初の広報による攻撃に＋2。'},local:{name:'地方の支持基盤',desc:'毎ターン最初の根回しカードにブロック＋3。'}};
const BASE=['explain','consult','research','proof','archive','local','lobby','joint','focus','decide','rebut','cut','audit','shield'];
let state=null,battle=null,mode='home',rewardStep='',message='',pending=null,returnMode='map',draft=null;
const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem('seikyoku-v3',JSON.stringify({state,battle,mode:mode==='deck'?returnMode:mode,rewardStep,message}))}catch(e){}}
function log(t){battle.log.unshift(t);battle.log=battle.log.slice(0,70)}
function startingDeck(type){let d=['explain','explain','consult','consult','research','research','proof','archive','local','lobby','joint','joint','decide','rebut','cut','audit'];return d.concat(type==='data'?['scholar','veteran','proof','shield']:type==='media'?['star','agency','debate','debate']:['broker','organizer','mobilize','sponsor'])}
function start(type){let deck=startingDeck(type),owned={};for(let id of [...BASE,'debate','veteran','scholar','star','agency','organizer','broker','mobilize','sponsor'])owned[id]=2;state={stage:0,deck,owned,supports:[],support:null,wins:0,type};battle=null;mode='map';message='初期デッキを選びました。カードを入れ替えても、そのまま出撃しても構いません。';render();save()}
function steps(){return '<div class="steps">'+STAGES.map((s,i)=>'<div class="step '+(state.stage===i?'active':'')+'">'+(i<state.stage?'✓ ':i+1+' / ')+s.name+'</div>').join('')+'</div>'}
function cardHTML(id,action='',disabled=false,foot=''){let c=CARDS[id];return '<button class="card '+(c.noir?'noir':c.kind||'')+'" '+(disabled?'disabled ':'')+(action?'onclick="'+action+'"':'')+'><span class="cost">'+(c.bad?'—':c.cost)+'</span><span class="type">'+c.type+'</span><span class="name">'+c.name+'</span>'+(c.role?'<small style="color:#52615f">'+c.role+'</small>':'')+'<span class="desc">'+c.desc+'</span><span class="foot">'+foot+'</span></button>'}
function renderOriginal(){if(mode==='home'){app.innerHTML='<div class="intro"><div class="eyebrow">あなたの政権は、どの手札で戦うか。</div><h2 style="font-family:serif;font-size:32px;margin-top:12px">政策を通し、選挙を勝ち抜く。</h2><p>場に残る人物と組織を組み合わせ、行動カードで相手のHPを削る。政策の実績を選挙へ、選挙の支持を次の政策へ。3戦の短いキャンペーンです。</p><div class="choices"><button class="choice" onclick="start(\'data\')"><h3>調査と根回し</h3><p>篠原 澪 ＋ 川瀬 修一<br>資料のドローと防御で安定して戦う。</p><b>初めてのプレイにおすすめ →</b></button><button class="choice" onclick="start(\'media\')"><h3>広報で突破</h3><p>朝倉 蓮 ＋ 広告代理店<br>広報を連携させ、大きな攻撃を狙う。</p><b>広報デッキで開始 →</b></button><button class="choice" onclick="start(\'noir\')"><h3>危険な人脈</h3><p>黒崎 玄 ＋ 裏のスポンサー<br>強い力を借り、後から回る負担を背負う。</p><b>裏人脈デッキで開始 →</b></button></div><p class="notice">敵の次の行動は公開。人物・組織は最大3枚。HPは各戦開始時に30へ回復します。ブラウザ内に進行を自動保存します。</p></div>';return}
 if(mode==='deck'){renderDeck();return}
 if(mode==='reward'){renderReward();return}
 if(mode==='complete'){app.innerHTML=steps()+'<div class="reward panel"><div class="eyebrow">CAMPAIGN COMPLETE</div><h2>政策成立 — 交通網整備へ</h2><p>政策審査、選挙、予算協議を突破しました。カードと支持基盤は所持したまま、3戦を再攻略できます。</p><div class="bar"><button class="btn primary" onclick="replay()">所持カードを引き継いで再挑戦</button><button class="btn" onclick="openCollection()">デッキを確認</button></div><p class="notice">確認したい点：人物を置くタイミング／退場への対処／同じデッキで政策と選挙を戦えるか／報酬を入れたくなったか。</p></div>';return}

function normalizeState(){state.difficulty=state.difficulty||'normal';state.tokens=state.tokens||0;state.cleared=state.cleared||[];state.packDry=state.packDry||0;state.farm=!!state.farm;state.stage=Math.min(3,Math.max(0,state.stage));}

function pickEnemyPlan(){let hand=battle.enemyHand,energy=3,plan=[],virtual=[...battle.enemyAllies],attacked=false,prepared=false;let candidates=hand.map((id,i)=>({id,i}));while(energy>0){let choices=candidates.filter(x=>ENEMY_CARDS[x.id].cost<=energy);if(!choices.length)break;let scored=choices.map(x=>{let c=ENEMY_CARDS[x.id],score=0,target=null;if(c.kind==='deploy'){score=virtual.length?-100:8;if(virtual.length===0)target=STAGES[state.stage].ally;}else if(c.kind==='remove'){let ally=battle.allies.filter(a=>!plan.some(p=>p.kind==='remove'&&p.target===a.id));if(ally.length){target=ally.sort((a,b)=>CARDS[b.id].cost-CARDS[a.id].cost)[0].id;score=state.difficulty==='advanced'?7:2}else score=-100;}else if(c.kind==='prep'){score=!prepared&&!attacked&&energy>=2&&choices.some(y=>['attack','audit'].includes(ENEMY_CARDS[y.id].kind)&&ENEMY_CARDS[y.id].cost<=energy-1)?7:-100;}else if(c.kind==='guard'){score=battle.enemyHP<20?6:(state.difficulty==='advanced'?2:4);if(plan.some(p=>p.kind==='guard'))score-=3;}else if(c.kind==='audit'){let burdens=battle.hand.concat(battle.pile,battle.discard).filter(id=>CARDS[id].bad).length;score=4+Math.min(4,burdens)}else score=(c.damage/c.cost)+(prepared?2:0);if(state.difficulty==='normal')score+=Math.random()*2;return {...x,c,score,target}}).filter(x=>x.score>-50);if(!scored.length)break;scored.sort((a,b)=>b.score-a.score);let x=scored[0],c=x.c;plan.push({id:x.id,kind:c.kind,target:x.target,cost:c.cost});energy-=c.cost;candidates=candidates.filter(y=>y.i!==x.i);if(c.kind==='deploy')virtual.push(x.target);if(c.kind==='prep')prepared=true;if(c.kind==='attack'||c.kind==='audit')attacked=true;}
 battle.plan=plan;battle.enemySpent=3-energy;battle.enemyChosen=plan.map(p=>p.id);battle.intent=['複数行動',0,0,null];}
function forecast(){let virtual=[...battle.enemyAllies],prep=0,damage=0,block=0,lines=[],weaken=battle.enemyWeaken||0;for(let p of battle.plan||[]){let c=ENEMY_CARDS[p.id],text='';if(p.kind==='deploy'){if(!virtual.includes(p.target)&&virtual.length<3){virtual.push(p.target);text=ENEMY_ALLIES[p.target].name+'を配置'}else text='配置済みのため不発';}else if(p.kind==='prep'){prep+=c.boost;text='次の攻撃＋'+c.boost;}else if(p.kind==='attack'||p.kind==='audit'){let boost=virtual.reduce((n,id)=>n+(enemyActive(id)?ENEMY_ALLIES[id].boost||0:0),0),extra=p.kind==='audit'?Math.min(6,battle.hand.concat(battle.pile,battle.discard).filter(id=>CARDS[id].bad).length*2):0;let d=Math.max(0,c.damage+boost+prep+extra-weaken);damage+=d;weaken=0;prep=0;text=d+'ダメージ';}else if(p.kind==='guard'){block+=c.block;text='次の手番にブロック'+c.block;}else if(p.kind==='remove'){let target=battle.allies.find(a=>a.id===p.target);text=target?(CARDS[p.target].name+'を退場'+(battle.protect?'（現在は保護あり）':'')):'対象が退場済み：不発';}lines.push('<div style="padding:5px 0;border-bottom:1px solid #69504b"><span class="badge">'+p.cost+'</span> '+c.name+' → '+text+'</div>')}return {damage,block,lines};}
function initTurn(carry=0){battle.turn++;battle.energy=3;battle.block=0;battle.enemyBlock=carry;battle.attacks=0;battle.tags={};battle.used={};battle.protect=0;for(let a of battle.allies){a.fired=false;if(CARDS[a.id].ability==='organizer')battle.block+=3}draw(5+battle.allies.filter(a=>CARDS[a.id].ability==='secretary').length);if(battle.hp<=0){lose();return}for(let a of battle.enemyAllies)battle.enemyBlock+=ENEMY_ALLIES[a].block||0;if(!battle.enemyPile)battle.enemyPile=enemyDeckForStage();if(!battle.enemyDiscard)battle.enemyDiscard=[];battle.enemyHand=[];for(let i=0;i<5;i++){if(!battle.enemyPile.length){battle.enemyPile=shuffle(battle.enemyDiscard);battle.enemyDiscard=[];}if(battle.enemyPile.length)battle.enemyHand.push(battle.enemyPile.pop())}pickEnemyPlan();log('第'+battle.turn+'ターン：敵は'+battle.plan.length+'枚、計'+battle.enemySpent+'コストの行動を予告。');}

function endTurn(){if(mode!=='battle'||pending)return;let prep=0,carry=0;for(let p of battle.plan){let c=ENEMY_CARDS[p.id];if(p.kind==='deploy'){if(!battle.enemyAllies.includes(p.target)&&battle.enemyAllies.length<3){battle.enemyAllies.push(p.target);log('敵が'+ENEMY_ALLIES[p.target].name+'を再配置。')}else log(c.name+'：配置済みのため不発。');}else if(p.kind==='prep'){prep+=c.boost;log('敵は次の攻撃を＋'+c.boost+'強化。')}else if(p.kind==='guard'){carry+=c.block;log('敵は次の手番のブロック＋'+c.block+'。')}else if(p.kind==='remove'){let i=battle.allies.findIndex(a=>a.id===p.target);if(i<0)log('協力者への切り崩し：対象が退場済みのため不発。');else if(battle.protect){battle.protect--;log('協力関係の維持で'+CARDS[p.target].name+'を守った。')}else{let a=battle.allies.splice(i,1)[0];battle.removed.push(a.id);battle.lossDraw=(battle.lossDraw||0)+activeAllies().filter(x=>CARDS[x.id].ability==='recovery').length*2;log(CARDS[a.id].name+'が退場した。')}}else{let boost=battle.enemyAllies.reduce((n,id)=>n+(enemyActive(id)?ENEMY_ALLIES[id].boost||0:0),0),extra=p.kind==='audit'?Math.min(6,battle.hand.concat(battle.pile,battle.discard).filter(id=>CARDS[id].bad).length*2):0,d=Math.max(0,c.damage+boost+prep+extra-(battle.enemyWeaken||0));battle.enemyWeaken=0;prep=0;let blocked=Math.min(d,battle.block);battle.block-=blocked;battle.hp=Math.max(0,battle.hp-d+blocked);log(c.name+'：'+(d-blocked)+'ダメージ（'+blocked+'を防いだ）。');if(battle.hp<=0){lose();return}}}

function gainCard(id){let current=state.owned[id]||0;if(current>=2){let tokens=RARE.includes(id)?5:UNCOMMON.includes(id)?3:1;state.tokens+=tokens;return {id,duplicate:true,tokens}}state.owned[id]=current+1;return {id,duplicate:false,tokens:0};}
function openPack(){let pool=POOLS[state.stage],out=[];for(let i=0;i<3;i++){let rareRate=state.difficulty==='advanced'?.18:.10,uncommonRate=state.difficulty==='advanced'?.40:.35,r=Math.random(),grade=r<rareRate?'レア':r<rareRate+uncommonRate?'アンコモン':'コモン';if(state.packDry>=5&&i===2&&!out.some(x=>RARE.includes(x.id)))grade='レア';let candidates=pool.filter(id=>rarity(id)===grade);if(!candidates.length)candidates=pool;out.push(gainCard(candidates[Math.floor(Math.random()*candidates.length)]))}state.packDry=out.some(x=>RARE.includes(x.id))?0:state.packDry+1;state.packResults=out;}
function win(){log('勝利！ '+STAGES[state.stage].enemy+'を突破。');normalizeState();state.wins++;let first=!state.cleared.includes(state.stage);if(first){state.cleared.push(state.stage);if(state.stage===0)state.owned.achievement=2;}openPack();mode='reward';pending=null;rewardStep='pack';message=first&&state.stage===0?'初回報酬：「交通網整備の実績」2枚を獲得。':'';render();save();}
