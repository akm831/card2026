let seed=0x7654321;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function copy(x){return JSON.parse(JSON.stringify(x))}function save(){try{localStorage.setItem('seikyoku-v13',JSON.stringify({state,battle,history,pending,seed,message,editBack}))}catch(e){}}function active(engine){return battle.allies.filter(a=>a.disabledUntil<battle.turn&&C[a.id].engine===engine)}

function enemyPlanScore(plan, view) {
  let damage=0, block=0, interference={};
  for (const card of plan) for (const effect of card.effects) {
    if (effect.op === 'damage') damage += effect.n;
    if (effect.op === 'block') block += effect.n;
    if (effect.op === 'bounce' || effect.op === 'suppress') {
      const ally=view.allies.find(a=>a.id===card.target);
      if (!ally || effect.aff && effect.aff !== ally.aff || effect.op==='suppress' && ally.disabledUntil>=view.turn+1) continue;
      const value=enemyPersonValue(ally,view)*(effect.op==='bounce'?.7:1);
      interference[ally.id]=Math.max(interference[ally.id]||0,value);
    }
  }
  const net=Math.max(0,damage-view.playerBlock);
  const attack=Math.min(view.playerHP,net) + (net>=view.playerHP && view.playerHP>0 ? 18 : 0) + damage*.05;
  // Guard is gained after the player's current turn and protects the following turn.
  const expected=Math.min(20,Math.max(6,(view.lastPlayerDamage || 6)+2));
  const defense=Math.min(block,expected)*(view.enemyHP<=12?1.3:.65);
  return attack + defense + Object.values(interference).reduce((n,x)=>n+x,0) - plan.reduce((n,c)=>n+c.cost,0)*.08;

function selectEnemyActions(hand, budget, view, reserved=[]) {
  const base=reserved.map(c=>({...c,target:enemyTarget(c,view)}));
  let best=[],score=enemyPlanScore(base,view);
  // At most seven cards: examine every affordable combination, rather than greedy ratios.
  for (let mask=1;mask<2**hand.length;mask++) {
    let cost=0,cards=[];
    for(let i=0;i<hand.length;i++)if(mask & 2**i){cost+=hand[i].cost;cards.push({...hand[i],target:enemyTarget(hand[i],view)});}
    if(cost>budget)continue;
    const value=enemyPlanScore(base.concat(cards),view);
    if(value>score+1e-9){score=value;best=cards;}
  }
  return base.concat(best);
}

function enemyPublicView(){return {playerHP:battle.hp,playerBlock:battle.block,enemyHP:battle.enemyHP,lastPlayerDamage:battle.lastPlayerDamage||0,turn:battle.turn,growth:copy(battle.growth||{}),allies:battle.allies.map(a=>({...a,aff:C[a.id].aff}))};}

function snap(){history.push(copy({battle,seed}));pending=null}function undo(all=false){if(!history.length)return;let s=all?history[0]:history[history.length-1];battle=copy(s.battle);seed=s.seed;if(all)history=[];else history.pop();pending=null;message='操作を取り消しました。同じ操作で引き直しても同じカードになります。';render();save()}
function play(i){let id=battle.hand[i];if(!id||!can(id))return;let c=C[id],targetEffect=c.effects.find(e=>['cancel','delay'].includes(e.op));if(targetEffect){let valid=validPlans(targetEffect);if(!valid.length){message='対象にできる予告がありません。';render();return}pending={i,targets:valid.map(p=>p.uid)};render();return}commit(i,null)}function target(uid){if(!pending?.targets.includes(uid))return;let i=pending.i;pending=null;commit(i,uid)}

function effect(e,uid){switch(e.op){case 'damage':{let extra=e.condition==='scandal'&&battle.plan.some(p=>p.issue==='scandal'&&!p.cancelled)||e.condition==='business'&&(battle.counts.business||0)>=2||e.condition==='community'&&battle.allies.some(a=>C[a.id].aff==='community'&&a.disabledUntil<battle.turn)?e.bonus||0:0;let evolved=battle.allies.some(a=>a.disabledUntil<battle.turn&&C[a.id].aff===battle.currentAff&&(battle.growth?.[a.id]?.level||0)>0);let bonus=evolved&&battle.currentCost>=2?4:0;let n=e.n+extra+battle.boost+bonus;battle.boost=0;let b=Math.min(n,battle.enemyBlock);battle.enemyBlock-=b;battle.enemyHP=Math.max(0,battle.enemyHP-n+b);break}case 'block':battle.block+=e.n;break;case 'draw':draw(e.n);break;case 'heal':battle.hp=Math.min(30,battle.hp+e.n);break;case 'boost':battle.boost+=e.n;break;case 'energy':battle.energy+=e.n;break;case 'protect':battle.protect+=e.n;break;case 'invest':battle.invest+=e.n;break;case 'nextDraw':battle.nextDraw+=e.n;break;case 'burden':for(let i=0;i<e.n;i++)battle.discard.push('burden');break;case 'scandal':for(let i=0;i<e.n;i++)battle.enemyPile.push({id:'scandal',name:'疑惑追及',issue:'scandal',cost:1,effects:[{op:'damage',n:5}]});battle.enemyPile=shuffle(battle.enemyPile);log('疑惑追及を敵の山札へ追加。次ターン以降に登場する可能性。');break;case 'cancel':case 'delay':{let p=battle.plan.find(p=>p.uid===uid);if(p){p.cancelled=true;if(e.op==='delay'){battle.deferred.push(copy(p));log(p.name+'を次ターンへ延期。')}else log(p.name+'を無効化。');changed()}break}case 'reduceIssue':{let n=0;for(let p of battle.plan)if(!p.cancelled&&p.issue===e.issue)for(let x of p.effects)if(x.op==='damage'){x.n=Math.max(0,x.n-e.n);n++}if(n)changed();break}case 'reverse':battle.plan.reverse();changed();break;case 'clean':{let n=e.n;for(let z of ['hand','discard','pile'])battle[z]=battle[z].filter(id=>{if(n&&C[id].bad){n--;return false}return true});break}case 'recover':if(battle.removed.length)battle.hand.push(battle.removed.pop());else draw(1);break}}
function commit(i,uid){snap();let id=battle.hand[i],c=C[id],n=cost(c);battle.currentAff=c.aff;battle.currentCost=c.cost;battle.currentCard=id;battle.energy-=n;battle.hand.splice(i,1);if(c.aff==='politics'&&c.type!=='person'&&battle.discount)battle.discount=false;if(c.type==='disrupt'&&active('disruptDiscount').length)battle.used.disruptDiscount=true;battle.used[id]=true;if(c.type!=='person')battle.counts[c.aff]=(battle.counts[c.aff]||0)+1;if(c.type==='person'){battle.allies.push({id,disabledUntil:0});battle.growth=battle.growth||{};battle.growth[id]=battle.growth[id]||{progress:0,level:0};battle.block+=3;if(active('deployDiscount').length)battle.discount=true;}else battle.discard.push(id);for(let e of c.effects)effect(e,uid);if(c.aff==='business'&&active('reserveBlock').length&&!battle.used.reserveBlock){battle.nextBlock+=2;battle.used.reserveBlock=true}if(c.aff==='community'&&active('rescue').length&&!battle.used.communityHeal){battle.hp=Math.min(30,battle.hp+1);battle.used.communityHeal=true}if(c.type!=='person')for(let a of [...battle.allies])if(a.disabledUntil<battle.turn&&C[a.id].aff===c.aff&&a.id!=='reporter')train(a.id);battle.currentCard=null;log(c.name+'を使用（'+n+'コスト）。');if(battle.enemyHP<=0)battle.outcome='win';render();save()}

replaceStarter('noir','favor','fulfillDeal');replaceStarter('noir','whip','staffChange');
function tutorialTip(){if(caseProfile()!==CASE_PROFILES.intro)return '';let tips=['敵の攻撃予告と自分のブロックを確認しましょう。使わないカードは次のターンへ残ります。','人物は配置し続けると条件を満たして成長します。ターン終了までは操作を戻せます。','手札が少ないときは温存も選択肢。追加ドローにコストを使うか考えましょう。'];return '<p class="panel"><b>入門ヒント：</b>'+tips[Math.min(2,battle.turn-1)]+'</p>';}
function selectProfile(key){if(state.phase!=='case'||!CASE_PROFILES[key]||key==='finance'&&state.clears<1||key==='public'&&state.clears<2)return;state.difficulty=key==='intro'?'normal':'advanced';state.challenge=key;state.prep=null;state.soft=null;render();save();}
function profileButtons(){return Object.entries(CASE_PROFILES).map(([key,p])=>'<button class="btn" '+((key==='finance'&&state.clears<1||key==='public'&&state.clears<2)?'disabled':'')+' onclick="selectProfile(\''+key+'\')">'+p.name+'</button>').join(' ')+'<p>本戦の論点カード枚数：'+Object.entries(caseProfile().counts).map(([k,n])=>ISSUES[k].name+' '+n+'枚').join(' ／ ')+'。本戦攻撃は実戦1で＋1、実戦2はさらにコスト2の追及＋1。双方HP30。</p>';}
function rewardPicker(){if(!state.pickPending)return '<p>選択報酬を獲得しました。</p>';return '<h3>次の対戦に向けて、好きなカードを1枚獲得</h3><p>ランダム報酬2枚に加え、1枚を選べます。所持上限2枚。</p><div class="deckgrid">'+Object.values(C).filter(c=>!c.bad&&(state.owned[c.id]||0)<2).map(c=>cardHTML(c,'<button class="btn" onclick="pickReward(\''+c.id+'\')">このカードを獲得</button>')).join('')+'</div>'+(Object.values(C).some(c=>!c.bad&&(state.owned[c.id]||0)<2)?'':'<button class="btn" onclick="pickReward(\'token\')">全カード所持済み：交換ポイント＋1</button>');}
function continueEpilogue(){if(state.phase!=='reward'||state.pickPending)return;state.phase='epilogue';render();save();}
function pickReward(id){if(state.phase!=='reward'||!state.pickPending)return;let eligible=Object.values(C).filter(c=>!c.bad&&(state.owned[c.id]||0)<2);if(id==='token'){if(eligible.length)return;state.tokens++;state.reward.push('全カード所持済み：交換ポイント＋1');}else{if(!eligible.some(c=>c.id===id))return;state.owned[id]=(state.owned[id]||0)+1;state.reward.push(C[id].name+'：選択報酬で1枚獲得');}state.pickPending=false;render();save();}
try{let raw=localStorage.getItem('seikyoku-v13');if(raw){let x=JSON.parse(raw);if(x.state&&x.state.deck.every(id=>C[id])){state=x.state;battle=x.battle;history=x.history||[];pending=x.pending;seed=x.seed;message=x.message||'';editBack=x.editBack||'case'}}}catch(e){}render();
</script></body></html>
