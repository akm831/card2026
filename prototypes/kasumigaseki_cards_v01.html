<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>政局の手札 — 霞が関カードバトル試作</title>
<style>
:root{--bg:#101b22;--panel:#1b2b34;--ink:#f0ead8;--muted:#acb8b9;--gold:#e4b760;--red:#e88a80;--green:#8bc6ae;--blue:#9dbedf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;font-size:14px}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.43}button:focus-visible{outline:3px solid white;outline-offset:3px}.wrap{max-width:1320px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:16px}h1{font-family:serif;margin:0;font-size:30px;letter-spacing:3px}h2{font-size:21px;margin:0 0 14px}h3{margin:0 0 8px}p{line-height:1.7}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px}.muted,small{color:var(--muted)}.btn{background:#30444d;border:1px solid #718188;padding:10px 16px;border-radius:4px}.primary{background:var(--gold);color:#19252a;border-color:var(--gold);font-weight:700}.danger{border-color:var(--red);color:var(--red)}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panel{background:var(--panel);border:1px solid #41535a;border-radius:6px;padding:18px}.intro{max-width:800px;margin:48px auto}.choices,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.choice{background:#21353e;border:1px solid #718188;border-top:4px solid var(--gold);padding:24px;text-align:left;border-radius:5px}.choice p{color:var(--muted)}.steps{display:flex;gap:8px;margin:18px 0}.step{padding:9px 13px;background:#1b2b34;color:var(--muted);border-bottom:2px solid #41535a}.step.active{color:var(--gold);border-color:var(--gold)}.arena{display:grid;grid-template-columns:1fr 1fr;gap:18px}.leader{display:flex;gap:15px;align-items:center;margin-bottom:12px}.portrait{width:62px;height:62px;flex-shrink:0;background:#344b53;border:2px solid var(--gold);display:grid;place-items:center;font-size:29px;font-family:serif}.enemy .portrait{border-color:var(--red);background:#47393c}.hphead{display:flex;justify-content:space-between;margin-bottom:7px}.meter{height:12px;background:#0d171d;border-radius:2px;overflow:hidden}.meter span{display:block;height:100%;background:var(--green);transition:width .3s}.enemy .meter span{background:var(--red)}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}.stat{padding:5px 8px;background:#101b22;border-radius:3px}.intent{padding:12px;margin-top:12px;background:#3b3030;border-left:3px solid var(--red);min-height:82px}.allies{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.ally{padding:11px;background:#243a42;border:1px solid #5b777e;min-height:130px;border-top:3px solid var(--green)}.ally.enemyally{border-top-color:var(--red)}.ally p{font-size:12px;line-height:1.5;margin:6px 0}.ally.empty{border-style:dashed;opacity:.45;display:grid;place-items:center}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{position:relative;background:#e8e1cb;color:#202b30;border:2px solid #b5ac94;border-top:5px solid #697f91;border-radius:5px;padding:13px;text-align:left;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .12s,box-shadow .12s}.card:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 5px 20px #0005}.card.person{border-top-color:#448772}.card.noir{border-top-color:#9e5660;background:#dacbd0}.card.attack{border-top-color:#b47b43}.card .cost{align-self:flex-end;border-radius:50%;background:#263c48;color:white;width:27px;height:27px;display:grid;place-items:center;font-weight:800}.card .name{font-size:16px;font-weight:800}.card .type{font-size:10px;color:#53615f;letter-spacing:1px}.card .desc{line-height:1.6;font-size:13px;flex:1}.card .foot{font-size:11px;color:#526257;border-top:1px solid #ada990;padding-top:8px}.card:disabled{opacity:.62}.mana{color:var(--gold);font-weight:800;font-size:22px}.bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:20px}.log{height:155px;overflow:auto;font-size:12px;line-height:1.9}.log div{border-bottom:1px solid #34464e;padding:3px 0}.log div:first-child{color:var(--gold)}.status{padding:10px 14px;border:1px solid var(--gold);color:var(--gold);margin:14px 0;min-height:41px}.reward{max-width:900px;margin:35px auto}.deckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.deckitem{background:#253840;padding:14px;border:1px solid #53696f;border-radius:4px}.deckitem p{font-size:12px;min-height:48px}.help{line-height:1.8}.support{color:var(--green);padding:9px 12px;background:#152c27;margin-top:12px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:6px;max-width:700px;width:92%;max-height:85vh}dialog::backdrop{background:#000a}.right{margin-left:auto}.badge{font-size:11px;padding:3px 6px;background:#101b22;border:1px solid #56696f}.collectionhead{margin:20px 0}.notice{font-size:12px;color:var(--muted);line-height:1.6}footer{margin-top:25px;color:var(--muted);font-size:11px;line-height:1.8}@media(max-width:850px){.arena,.bottom{grid-template-columns:1fr}.hand{grid-template-columns:repeat(3,1fr)}.deckgrid{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:23px}.steps{font-size:11px}}@media(max-width:480px){.hand{grid-template-columns:repeat(2,1fr)}.allies{gap:5px}.ally{padding:7px}.steps{gap:3px}.step{padding:7px}header{flex-wrap:wrap}.card{min-height:185px}}
</style></head><body><div class="wrap"><header><div><div class="eyebrow">KASUMIGASEKI / CARD BATTLE PROTOTYPE 01</div><h1>政局の手札</h1></div><div class="bar"><button class="btn" onclick="showHelp()">遊び方</button><button class="btn" onclick="openCollection()">デッキ・所持カード</button><button class="btn" onclick="confirmReset()">最初から</button></div></header><main id="app"></main><footer>歴史案件を着想源にした架空の政治カードゲームです。人物・組織・事件の組み合わせは創作で、実在の案件に不正があったと示すものではありません。<br>HTML単体で動作します。保存できる環境では進行状況をブラウザに自動保存します。数値は試作用です。</footer></div><dialog id="help"></dialog><dialog id="collection"></dialog>
<script>
'use strict';
const CARDS={
 explain:{name:'政策説明',cost:1,type:'攻撃・広報',kind:'attack',desc:'6ダメージ。',atk:6,tag:'media'},
 consult:{name:'事前協議',cost:1,type:'防御・根回し',desc:'ブロック6。',block:6,tag:'lobby'},
 research:{name:'調査報告',cost:1,type:'攻撃・資料',kind:'attack',desc:'4ダメージ。1枚引く。',atk:4,draw:1,tag:'data'},
 proof:{name:'技術実証',cost:2,type:'攻防・資料',kind:'attack',desc:'8ダメージ。ブロック7。',atk:8,block:7,tag:'data'},
 archive:{name:'資料室',cost:1,type:'ドロー・資料',desc:'カードを2枚引く。',draw:2,tag:'data'},
 local:{name:'地方の要望',cost:1,type:'攻撃・根回し',kind:'attack',desc:'7ダメージ。',atk:7,tag:'lobby'},
 lobby:{name:'関係者への根回し',cost:1,type:'防御・根回し',desc:'ブロック4。1枚引く。',block:4,draw:1,tag:'lobby'},
 joint:{name:'共同提案',cost:1,type:'攻撃',kind:'attack',desc:'5ダメージ。このターンに攻撃済みなら9ダメージ。',atk:5,combo:9},
 focus:{name:'重点公約',cost:1,type:'攻撃・広報',kind:'attack',desc:'10ダメージ。使用前に山札の上から1枚を捨てる。',atk:10,mill:1,tag:'media'},
 decide:{name:'リーダーの決断',cost:2,type:'攻撃',kind:'attack',desc:'HPを3消費し、15ダメージ。HPが3以下では使用不可。',atk:15,hp:3},
 rebut:{name:'反証資料',cost:1,type:'防御・資料',desc:'ブロック9。',block:9,tag:'data'},
 debate:{name:'テレビ討論',cost:1,type:'攻防・広報',kind:'attack',desc:'5ダメージ。ブロック4。',atk:5,block:4,tag:'media'},
 cut:{name:'協力関係の切り崩し',cost:1,type:'対抗',desc:'相手の協力者を1枚選び退場させ、3ダメージ。対象がなくても使える。',atk:3,remove:true},
 audit:{name:'不正の追及',cost:1,type:'対抗・資料',desc:'8ダメージ。相手に裏人脈があれば、1枚選び退場させる。',atk:8,remove:'noir',tag:'data'},
 shield:{name:'協力関係の維持',cost:1,type:'防御',desc:'ブロック5。このターン、協力者1人の退場を防ぐ。',block:5,protect:true},
 veteran:{name:'川瀬 修一',cost:2,type:'人物・議員',kind:'person',role:'地方に強いベテラン',desc:'毎ターン最初の根回しカードにブロック＋4。',ability:'lobby'},
 scholar:{name:'篠原 澪',cost:2,type:'人物・議員',kind:'person',role:'政策通の若手',desc:'毎ターン最初の資料カードで1枚引き、ブロック＋2。',ability:'data'},
 star:{name:'朝倉 蓮',cost:2,type:'人物・議員',kind:'person',role:'改革派の論客',desc:'毎ターン最初の広報による攻撃にダメージ＋4。',ability:'media'},
 agency:{name:'東都コミュニケーションズ',cost:2,type:'組織・広告代理店',kind:'person',role:'戦略広報チーム',desc:'各ターン2枚目の広報カードでコスト＋1。',ability:'agency'},
 organizer:{name:'森山 文枝',cost:1,type:'人物・組織',kind:'person',role:'地方組織の調整役',desc:'次ターンから、毎ターン開始時にブロック3。',ability:'organizer'},
 broker:{name:'黒崎 玄',cost:1,type:'人物・裏人脈',kind:'person',noir:true,role:'闇の仲介人',desc:'毎ターン最初の攻撃に＋5。登場時、「見返り要求」2枚を捨て札へ。',ability:'broker'},
 mobilize:{name:'裏の動員',cost:1,type:'攻撃・裏人脈',kind:'noir',desc:'13ダメージ。「工作の発覚」を捨て札へ。',atk:13,burden:'exposure'},
 sponsor:{name:'裏のスポンサー',cost:0,type:'資金・裏人脈',kind:'noir',desc:'コスト＋2。「見返り要求」を捨て札へ。1ターン1回。',energy:2,burden:'demand',once:true},
 demand:{name:'見返り要求',cost:99,type:'負担',kind:'noir',desc:'使用不可。引くとHPを3失う。手札1枠を占める。',bad:3},
 exposure:{name:'工作の発覚',cost:99,type:'負担',kind:'noir',desc:'使用不可。引くとHPを4失う。手札1枠を占める。',bad:4},
 achievement:{name:'交通網整備の実績',cost:1,type:'攻撃・広報・実績',kind:'attack',desc:'7ダメージ。協力者がいれば10ダメージ。',atk:7,allyAtk:10,tag:'media'},
 precision:{name:'精密な調査報告',cost:1,type:'攻撃・資料',kind:'attack',desc:'6ダメージ。1枚引く。',atk:6,draw:1,tag:'data'},
 secretary:{name:'相沢 凪',cost:1,type:'人物・議員',kind:'person',role:'調整役の秘書官出身',desc:'次ターンから、毎ターン開始時に1枚多く引く。',ability:'secretary'},
 scoop:{name:'調査報道',cost:1,type:'対抗・資料',desc:'7ダメージ。相手に裏人脈があれば12ダメージ。',atk:7,noirAtk:12,tag:'data'}
};
const STAGES=[
 {name:'夢の超特急',sub:'政策戦 / 計画の事業審査',enemy:'計画審査チーム',role:'「需要と実現性を示してください」',hp:44,ally:'expert',intro:'新しい幹線鉄道の構想を、実現できる計画として認めさせる。協力者を展開し、予告された追及をしのごう。',actions:[['需要への疑問',7,0,null],['技術面の追及',9,0,null],['予算の精査',5,5,null],['慎重審議',0,9,null],['計画の再検討',12,0,null],['協力者への圧力',5,0,'remove'],['需要への疑問',7,0,null],['追加説明の要求',8,0,null]]},
 {name:'都市の激戦区',sub:'選挙戦 / 与党選対本部',enemy:'対立候補の選挙陣営',role:'「その計画で、暮らしは変わるのか」',hp:48,ally:'media',intro:'政策審査で得た実績を訴え、支持を獲得する。勝利後、都市か地方の支持基盤を選べる。',actions:[['対立候補の街頭演説',8,0,null],['テレビでの批判',10,0,null],['支持組織の動員',5,5,null],['候補者への攻勢',7,0,'remove'],['公約比較',6,3,null],['不正疑惑の追及',7,0,'audit'],['最後の訴え',12,0,null],['支持組織の動員',5,5,null]]},
 {name:'予算を通せ',sub:'政策戦 / 最終予算協議',enemy:'慎重派の予算調整チーム',role:'「財源と優先順位を詰めましょう」',hp:55,ally:'noir',intro:'選挙で獲得した支持基盤を生かし、最終協議へ。相手の裏人脈を退場させるか、本体を攻めるかを選ぼう。',actions:[['財源不足の指摘',9,0,null],['要求額の圧縮',7,6,null],['追加査定',11,0,null],['協力者への圧力',6,0,'remove'],['慎重審議',0,12,null],['不正疑惑の追及',8,0,'audit'],['最終査定',14,0,null],['要求額の圧縮',7,6,null]]}
];
const ENEMY_ALLIES={expert:{name:'慎重な専門委員',desc:'毎ターン、相手にブロック2。',block:2},media:{name:'対立陣営の広報参謀',desc:'相手の攻撃に＋2。',boost:2},noir:{name:'利権の仲介人',desc:'相手の攻撃に＋3。不正の追及で退場できる。',boost:3,noir:true}};
const SUPPORTS={city:{name:'都市の支持基盤',desc:'毎ターン最初の広報による攻撃に＋2。'},local:{name:'地方の支持基盤',desc:'毎ターン最初の根回しカードにブロック＋3。'}};
const BASE=['explain','consult','research','proof','archive','local','lobby','joint','focus','decide','rebut','cut','audit','shield'];
let state=null,battle=null,mode='home',rewardStep='',message='',pending=null,returnMode='map',draft=null;
const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem('seikyoku-v1',JSON.stringify({state,battle,mode:mode==='deck'?returnMode:mode,rewardStep,message}))}catch(e){}}
function log(t){battle.log.unshift(t);battle.log=battle.log.slice(0,70)}
function startingDeck(type){let d=['explain','explain','consult','consult','research','research','proof','archive','local','lobby','joint','joint','decide','rebut','cut','audit'];return d.concat(type==='data'?['scholar','veteran','proof','shield']:type==='media'?['star','agency','debate','debate']:['broker','organizer','mobilize','sponsor'])}
function start(type){let deck=startingDeck(type),owned={};for(let id of [...BASE,'debate','veteran','scholar','star','agency','organizer','broker','mobilize','sponsor'])owned[id]=2;state={stage:0,deck,owned,supports:[],support:null,wins:0,type};battle=null;mode='map';message='初期デッキを選びました。カードを入れ替えても、そのまま出撃しても構いません。';render();save()}
function steps(){return '<div class="steps">'+STAGES.map((s,i)=>'<div class="step '+(state.stage===i?'active':'')+'">'+(i<state.stage?'✓ ':i+1+' / ')+s.name+'</div>').join('')+'</div>'}
function cardHTML(id,action='',disabled=false,foot=''){let c=CARDS[id];return '<button class="card '+(c.noir?'noir':c.kind||'')+'" '+(disabled?'disabled ':'')+(action?'onclick="'+action+'"':'')+'><span class="cost">'+(c.bad?'—':c.cost)+'</span><span class="type">'+c.type+'</span><span class="name">'+c.name+'</span>'+(c.role?'<small style="color:#52615f">'+c.role+'</small>':'')+'<span class="desc">'+c.desc+'</span><span class="foot">'+foot+'</span></button>'}
function render(){if(mode==='home'){app.innerHTML='<div class="intro"><div class="eyebrow">あなたの政権は、どの手札で戦うか。</div><h2 style="font-family:serif;font-size:32px;margin-top:12px">政策を通し、選挙を勝ち抜く。</h2><p>場に残る人物と組織を組み合わせ、行動カードで相手のHPを削る。政策の実績を選挙へ、選挙の支持を次の政策へ。3戦の短いキャンペーンです。</p><div class="choices"><button class="choice" onclick="start(\'data\')"><h3>調査と根回し</h3><p>篠原 澪 ＋ 川瀬 修一<br>資料のドローと防御で安定して戦う。</p><b>初めてのプレイにおすすめ →</b></button><button class="choice" onclick="start(\'media\')"><h3>広報で突破</h3><p>朝倉 蓮 ＋ 広告代理店<br>広報を連携させ、大きな攻撃を狙う。</p><b>広報デッキで開始 →</b></button><button class="choice" onclick="start(\'noir\')"><h3>危険な人脈</h3><p>黒崎 玄 ＋ 裏のスポンサー<br>強い力を借り、後から回る負担を背負う。</p><b>裏人脈デッキで開始 →</b></button></div><p class="notice">敵の次の行動は公開。人物・組織は最大3枚。HPは各戦開始時に30へ回復します。ブラウザ内に進行を自動保存します。</p></div>';return}
 if(mode==='deck'){renderDeck();return}
 if(mode==='reward'){renderReward();return}
 if(mode==='complete'){app.innerHTML=steps()+'<div class="reward panel"><div class="eyebrow">CAMPAIGN COMPLETE</div><h2>政策成立 — 交通網整備へ</h2><p>政策審査、選挙、予算協議を突破しました。カードと支持基盤は所持したまま、3戦を再攻略できます。</p><div class="bar"><button class="btn primary" onclick="replay()">所持カードを引き継いで再挑戦</button><button class="btn" onclick="openCollection()">デッキを確認</button></div><p class="notice">確認したい点：人物を置くタイミング／退場への対処／同じデッキで政策と選挙を戦えるか／報酬を入れたくなったか。</p></div>';return}
 if(mode==='map'){let s=STAGES[state.stage];app.innerHTML=steps()+'<div class="reward panel"><div class="eyebrow">'+s.sub+'</div><h2 style="margin-top:12px">'+s.name+'</h2><p>'+s.intro+'</p><p>対戦相手：<b>'+s.enemy+'</b>　HP '+s.hp+'</p><div class="support">装備中：'+(state.support?SUPPORTS[state.support].name+' — '+SUPPORTS[state.support].desc:'支持基盤なし。選挙に勝つと獲得できます。')+'</div><p class="notice">'+message+'</p><div class="bar"><button class="btn primary" onclick="startBattle()">このデッキで出撃</button><button class="btn" onclick="openCollection()">デッキを編成（'+state.deck.length+'/20）</button></div></div>';return}
 renderBattle()}
function initTurn(){battle.turn++;battle.energy=3;battle.block=0;battle.enemyBlock=0;battle.attacks=0;battle.tags={};battle.used={};battle.protect=0;for(let a of battle.allies)a.fired=false;for(let a of battle.allies){if(a.id==='organizer')battle.block+=3}draw(5+battle.allies.filter(a=>a.id==='secretary').length);if(battle.hp<=0){lose();return}for(let a of battle.enemyAllies)battle.enemyBlock+=ENEMY_ALLIES[a].block||0;if(!battle.enemyDeck.length)battle.enemyDeck=shuffle(STAGES[state.stage].actions);battle.intent=battle.enemyDeck.pop();log('第'+battle.turn+'ターン：'+battle.intent[0]+'が予告された。')}
function startBattle(){if(state.deck.length!==20){message='デッキを20枚にしてください。';render();return}battle={hp:30,maxHP:30,enemyHP:STAGES[state.stage].hp,maxEnemy:STAGES[state.stage].hp,energy:3,block:0,enemyBlock:0,turn:0,hand:[],pile:shuffle(state.deck),discard:[],removed:[],allies:[],enemyAllies:[STAGES[state.stage].ally],enemyDeck:shuffle(STAGES[state.stage].actions),log:[],tags:{},used:{},attacks:0,protect:0,intent:null};mode='battle';pending=null;message='カードをクリックして使用。相手の行動を見て、攻撃か防御を選びましょう。';initTurn();render();save()}
function draw(n){for(let i=0;i<n;i++){if(!battle.pile.length){if(!battle.discard.length)return;battle.pile=shuffle(battle.discard);battle.discard=[];log('捨て札をシャッフルして山札に戻した。')}let id=battle.pile.pop();battle.hand.push(id);if(CARDS[id].bad){battle.hp=Math.max(0,battle.hp-CARDS[id].bad);log(CARDS[id].name+'を引いた：HP −'+CARDS[id].bad);if(battle.hp<=0)return}}}
function actualCost(id){return CARDS[id].cost}
function canPlay(id){let c=CARDS[id];return !c.bad&&battle.energy>=actualCost(id)&&(!c.hp||battle.hp>c.hp)&&(!c.once||!battle.used[id])&&(!(c.kind==='person')||!battle.allies.some(a=>a.id===id))}
function play(i,target=null,replace=null){if(mode!=='battle'||pending&&target===null&&replace===null)return;let id=battle.hand[i],c=CARDS[id];if(!c||!canPlay(id))return;
 if(c.kind==='person'&&battle.allies.length>=3&&replace===null){pending={index:i,kind:'replace'};message='入れ替える自分の協力者をクリックしてください（退場したカードはこの戦闘中、山札に戻りません）。';render();return}
 let targets=c.remove===true?battle.enemyAllies.map((_,j)=>j):c.remove==='noir'?battle.enemyAllies.flatMap((a,j)=>ENEMY_ALLIES[a].noir?[j]:[]):[];
 if(targets.length&&target===null){pending={index:i,kind:'enemy',targets};message='退場させる相手の協力者をクリックしてください。';render();return}
 pending=null;battle.energy-=actualCost(id);battle.hand.splice(i,1);battle.used[id]=true;if(c.hp)battle.hp-=c.hp;
 if(c.kind==='person'){if(replace!==null){let old=battle.allies.splice(replace,1)[0];battle.removed.push(old.id);log(CARDS[old.id].name+'を入れ替えた。')}battle.allies.push({id,fired:false});if(id==='broker'){battle.discard.push('demand','demand');log('見返り要求2枚が捨て札に加わった。')}log(c.name+'を配置。');message=c.name+'が陣営に加わりました。';render();save();return}
 battle.discard.push(id);let atk=c.combo&&battle.attacks?c.combo:c.allyAtk&&battle.allies.length?c.allyAtk:c.noirAtk&&battle.enemyAllies.some(a=>ENEMY_ALLIES[a].noir)?c.noirAtk:c.atk||0,block=c.block||0,extraDraw=0;
 const firstTag=c.tag&&!(battle.tags[c.tag]);
 if(state.support==='city'&&c.tag==='media'&&atk&& !battle.used.supportCity){atk+=2;battle.used.supportCity=true}
 if(state.support==='local'&&c.tag==='lobby'&&firstTag)block+=3;
 for(let a of battle.allies){let ability=CARDS[a.id].ability;if(ability==='media'&&c.tag==='media'&&atk&&!a.fired){atk+=4;a.fired=true}if(ability==='broker'&&atk&&!a.fired){atk+=5;a.fired=true}if(ability==='lobby'&&c.tag==='lobby'&&!a.fired){block+=4;a.fired=true}if(ability==='data'&&c.tag==='data'&&!a.fired){block+=2;extraDraw++;a.fired=true}}
 if(c.tag)battle.tags[c.tag]=(battle.tags[c.tag]||0)+1;
 for(let a of battle.allies)if(CARDS[a.id].ability==='agency'&&c.tag==='media'&&battle.tags.media===2&&!a.fired){battle.energy++;a.fired=true;log('広告代理店の連携：コスト＋1。')}
 if(target!==null&&targets.includes(target)){let gone=battle.enemyAllies.splice(target,1)[0];log(ENEMY_ALLIES[gone].name+'を退場させた。')}
 if(atk){let blocked=Math.min(atk,battle.enemyBlock);battle.enemyBlock-=blocked;battle.enemyHP=Math.max(0,battle.enemyHP-atk+blocked);battle.attacks++;log(c.name+'：'+(atk-blocked)+'ダメージ'+(blocked?'（'+blocked+'を防がれた）':'')+'。')}
 if(block){battle.block+=block;log('ブロック＋'+block+'。')}if(c.protect)battle.protect++;
 if(c.energy)battle.energy+=c.energy;if(c.burden){battle.discard.push(c.burden);log(CARDS[c.burden].name+'が捨て札に加わった。')}
 if(c.mill){for(let n=0;n<c.mill;n++){if(!battle.pile.length&&battle.discard.length){battle.pile=shuffle(battle.discard);battle.discard=[]}if(battle.pile.length){let lost=battle.pile.pop();battle.discard.push(lost);log(CARDS[lost].name+'を山札から捨てた。')}}}
 if(battle.enemyHP<=0){win();return}draw((c.draw||0)+extraDraw);if(battle.hp<=0){lose();return}message=c.name+'を使用しました。';render();save()}
function selectAlly(side,i){if(!pending)return;let p=pending;if(p.kind==='replace'&&side==='self')play(p.index,null,i);else if(p.kind==='enemy'&&side==='enemy'&&p.targets.includes(i))play(p.index,i,null)}
function cancelTarget(){pending=null;message='カード選択を取り消しました。';render()}
function endTurn(){if(mode!=='battle'||pending)return;let a=battle.intent,boost=battle.enemyAllies.reduce((n,id)=>n+(ENEMY_ALLIES[id].boost||0),0),d=a[1]>0?a[1]+boost:0;if(a[3]==='audit'){let count=battle.hand.concat(battle.pile,battle.discard).filter(id=>CARDS[id].bad).length;d+=Math.min(6,count*2);if(count)log('不正疑惑の追及：負担カードにより攻撃＋'+Math.min(6,count*2)+'。')}
 let blocked=Math.min(d,battle.block);battle.hp=Math.max(0,battle.hp-d+blocked);log(a[0]+'：'+(d-blocked)+'ダメージ（'+blocked+'を防いだ）。');
 if(a[3]==='remove'&&battle.allies.length){if(battle.protect){battle.protect--;log('協力関係の維持で退場を防いだ。')}else{let j=Math.floor(Math.random()*battle.allies.length),gone=battle.allies.splice(j,1)[0];battle.removed.push(gone.id);log(CARDS[gone.id].name+'が退場した。')}}
 battle.discard.push(...battle.hand);battle.hand=[];if(battle.hp<=0){lose();return}initTurn();if(mode==='battle')battle.enemyBlock+=a[2];message='新しい手札です。相手の予告を確認しましょう。';render();save()}
function lose(){mode='defeat';pending=null;message='HPが0になり、陣営は撤退しました。所持カードは失いません。';render();save()}
function win(){log('勝利！ '+STAGES[state.stage].enemy+'を突破。');state.wins++;mode='reward';pending=null;rewardStep=state.stage===1?'support':'card';if(state.stage===0){state.owned.achievement=2;message='「交通網整備の実績」2枚を獲得。選挙でも使える広報カードです。'}else message='最終協議を突破しました。';render();save()}
function chooseReward(id){state.owned[id]=2;finishReward('「'+CARDS[id].name+'」2枚を獲得。デッキは自動変更しません。編成画面で入れ替えられます。')}
function chooseSupport(id){if(!state.supports.includes(id))state.supports.push(id);state.support=id;finishReward('「'+SUPPORTS[id].name+'」を獲得し、装備しました。')}
function finishReward(t){state.stage++;message=t;mode=state.stage>=3?'complete':'map';rewardStep='';render();save()}
function renderReward(){let content=rewardStep==='support'?'<h2>選挙勝利 — 支持基盤を選ぶ</h2><p>政策の実績を支持へつなげました。次の政策戦へ持ち込む基盤を選んでください。</p><div class="choices">'+Object.entries(SUPPORTS).map(([id,s])=>'<button class="choice" onclick="chooseSupport(\''+id+'\')"><h3>'+s.name+'</h3><p>'+s.desc+'</p><b>'+(state.supports.includes(id)?'所持済み・装備する':'獲得して装備する')+' →</b></button>').join('')+'</div>':'<h2>勝利 — 報酬カードを選ぶ</h2><p>'+message+'</p><div class="grid">'+['precision','secretary','scoop'].map(id=>cardHTML(id,"chooseReward('"+id+"')",false,state.owned[id]?'所持済み。別の報酬を選べます':'2枚獲得・次の戦闘前に編成')).join('')+'</div>';app.innerHTML=steps()+'<div class="reward panel">'+content+'</div>'}
function allyHTML(a,i,side){let c=side==='self'?CARDS[a.id]:ENEMY_ALLIES[a],active=pending&&(pending.kind==='replace'&&side==='self'||pending.kind==='enemy'&&side==='enemy'&&pending.targets.includes(i));return '<div class="ally '+(side==='enemy'?'enemyally':'')+'" '+(active?'style="outline:2px solid var(--gold)"':'')+'><b>'+c.name+'</b><p>'+(c.role||'対立陣営の協力者')+'</p><p>'+c.desc+'</p>'+(active?'<button class="btn" onclick="selectAlly(\''+side+'\','+i+')">'+(side==='self'?'入れ替える':'退場させる')+'</button>':'')+'</div>'}
function renderBattle(){let s=STAGES[state.stage];let a=battle.intent||['',0,0,null],boost=battle.enemyAllies.reduce((n,id)=>n+(ENEMY_ALLIES[id].boost||0),0),d=a[1]?a[1]+boost:0;if(a[3]==='audit')d+=Math.min(6,battle.hand.concat(battle.pile,battle.discard).filter(id=>CARDS[id].bad).length*2);let enemyIntent=d+'ダメージ'+(a[2]?' ／ 次の手番にブロック'+a[2]:'')+(a[3]==='remove'?' ／ 協力者1人をランダムに退場':'');
 app.innerHTML=steps()+'<div class="sectionhead"><div><span class="eyebrow">'+s.sub+'</span><h2 style="margin:6px 0 0">'+s.name+'</h2></div><span class="badge">TURN '+battle.turn+'</span></div><div class="arena"><section class="panel"><div class="leader"><div class="portrait">政</div><div><h3>'+(state.stage===1?'与党選挙対策本部':'計画推進の政権チーム')+'</h3><small>協力者を組み合わせ、手札で突破する</small></div></div><div class="hphead"><b>HP '+battle.hp+' / 30</b><span>ブロック '+battle.block+'</span></div><div class="meter"><span style="width:'+battle.hp/30*100+'%"></span></div><div class="support">'+(state.support?SUPPORTS[state.support].name+'：'+SUPPORTS[state.support].desc:'支持基盤：選挙勝利後に獲得')+'</div><div class="allies">'+battle.allies.map((x,i)=>allyHTML(x,i,'self')).join('')+Array.from({length:3-battle.allies.length},()=>'<div class="ally empty">協力者を配置</div>').join('')+'</div></section><section class="panel enemy"><div class="leader"><div class="portrait">'+(state.stage===1?'選':'審')+'</div><div><h3>'+s.enemy+'</h3><small>'+s.role+'</small></div></div><div class="hphead"><b>HP '+battle.enemyHP+' / '+battle.maxEnemy+'</b><span>ブロック '+battle.enemyBlock+'</span></div><div class="meter"><span style="width:'+battle.enemyHP/battle.maxEnemy*100+'%"></span></div><div class="intent"><b>次の行動：'+a[0]+'</b><p style="margin:7px 0 0">'+enemyIntent+'</p></div><div class="allies">'+battle.enemyAllies.map((x,i)=>allyHTML(x,i,'enemy')).join('')+'</div></section></div><div class="status" role="status">'+message+(pending?' <button class="btn" onclick="cancelTarget()">取り消す</button>':'')+'</div>'+(mode==='defeat'?'<div class="panel"><h2>陣営撤退</h2><div class="bar"><button class="btn primary" onclick="startBattle()">同じデッキで再挑戦</button><button class="btn" onclick="openCollection()">デッキを組み直す</button></div></div>':'<div class="sectionhead"><div><span class="mana">コスト '+battle.energy+' / 3</span><small>　手札 '+battle.hand.length+'枚</small></div><button class="btn primary" '+(pending?'disabled':'')+' onclick="endTurn()">ターン終了 →</button></div><div class="hand">'+battle.hand.map((id,i)=>cardHTML(id,'play('+i+')',!!pending||!canPlay(id),CARDS[id].bad?'引いたときにHPを失う負担カード':CARDS[id].kind==='person'?'場に残る／同名は1枚まで':'使用後は捨て札へ')).join('')+'</div>')+'<div class="bottom"><div class="panel"><h3>戦況ログ</h3><div class="log">'+battle.log.map(t=>'<div>'+t+'</div>').join('')+'</div></div><div class="panel"><h3>山札 '+battle.pile.length+' ／ 捨て札 '+battle.discard.length+' ／ 退場 '+battle.removed.length+'</h3><div class="bar"><button class="btn" onclick="inspectPile(\'pile\')">山札を見る</button><button class="btn" onclick="inspectPile(\'discard\')">捨て札を見る</button></div><p class="notice">山札は順不同で表示。場に置いた人物は山札から抜けます。退場した人物は戦闘終了まで戻りません。</p></div></div>'}
function inspectPile(which){let counts={};battle[which].forEach(id=>counts[id]=(counts[id]||0)+1);let dlg=document.getElementById('collection');dlg.innerHTML='<h2>'+(which==='pile'?'山札（順不同）':'捨て札')+'</h2>'+Object.keys(counts).sort().map(id=>'<p>'+CARDS[id].name+' ×'+counts[id]+'</p>').join('')+'<button class="btn" onclick="this.closest(\'dialog\').close()">閉じる</button>';dlg.showModal()}
function openCollection(){if(!state){showHelp();return}if(mode==='battle'||mode==='reward'){let dlg=document.getElementById('collection');let counts={};state.deck.forEach(id=>counts[id]=(counts[id]||0)+1);dlg.innerHTML='<h2>現在のデッキ（戦闘・報酬中は編集不可）</h2>'+Object.entries(counts).map(([id,n])=>'<p>'+CARDS[id].name+' ×'+n+'</p>').join('')+'<button class="btn" onclick="this.closest(\'dialog\').close()">閉じる</button>';dlg.showModal();return}returnMode=mode;draft=[...state.deck];mode='deck';render()}
function editDeck(id,delta){if(delta===1&&draft.length<20&&draft.filter(x=>x===id).length<Math.min(2,state.owned[id]))draft.push(id);else if(delta===-1){let i=draft.indexOf(id);if(i>=0)draft.splice(i,1)}render()}
function commitDeck(){if(draft.length!==20)return;state.deck=[...draft];draft=null;mode=returnMode;message='デッキを保存しました。';render();save()}
function cancelDeck(){draft=null;mode=returnMode;render()}
function equip(id){state.support=id||null;render();save()}
function renderDeck(){app.innerHTML='<div class="collectionhead"><h2>デッキ編成 <span class="mana">'+draft.length+' / 20枚</span></h2><p class="muted">各カード最大2枚。人物は同名を同時に配置できません。余分な人物を入れると引きやすくなりますが、行動カードが減ります。</p><div class="bar"><button class="btn primary" '+(draft.length!==20?'disabled':'')+' onclick="commitDeck()">保存して戻る</button><button class="btn" onclick="cancelDeck()">変更を取り消す</button></div>'+(state.supports.length?'<div class="support">支持基盤： <button class="btn" onclick="equip(\'\')">装備なし</button> '+state.supports.map(id=>'<button class="btn '+(state.support===id?'primary':'')+'" onclick="equip(\''+id+'\')">'+SUPPORTS[id].name+'</button>').join(' ')+'</div>':'')+'</div><div class="deckgrid">'+Object.keys(state.owned).map(id=>{let c=CARDS[id],n=draft.filter(x=>x===id).length;return '<div class="deckitem"><small>'+c.type+' / コスト'+c.cost+'</small><h3 style="margin-top:8px">'+c.name+'</h3><p>'+c.desc+'</p><div class="bar"><button class="btn" '+(!n?'disabled':'')+' onclick="editDeck(\''+id+'\',-1)">−</button><b>'+n+' / '+state.owned[id]+'</b><button class="btn" '+(n>=2||draft.length>=20?'disabled':'')+' onclick="editDeck(\''+id+'\',1)">＋</button></div></div>'}).join('')+'</div>'}
function replay(){state.stage=0;mode='map';battle=null;message='所持カードと支持基盤を引き継ぎました。別の組み合わせも試せます。';render();save()}
function confirmReset(){if(state&&!confirm('進行・獲得カードをリセットして、初期デッキ選択へ戻りますか？'))return;state=null;battle=null;mode='home';pending=null;draft=null;message='';render();save()}
function showHelp(){let d=document.getElementById('help');d.innerHTML='<h2>遊び方</h2><div class="help"><p><b>目的：</b>カードを使い、相手のHPを0にする。自分のHPが0なら敗北。</p><p><b>毎ターン：</b>コスト3、手札5枚。カードをクリックすると使用。ターン終了で敵の予告行動が実行されます。未使用札は捨て札へ。</p><p><b>防御：</b>ブロックがダメージを肩代わりします。次の自分のターンに消えます。HP消費と負担カードのダメージは防げません。</p><p><b>人物・組織：</b>最大3枚を場に配置。固有能力は主に毎ターン1回。4枚目は既存の協力者と入れ替え。同名を重ねて置けません。</p><p><b>対抗カード：</b>相手の協力者を選んで退場させます。「協力関係の維持」は、そのターンの退場を1回防ぎます。</p><p><b>カード蓄積：</b>政策勝利でカード、選挙勝利で支持基盤を獲得。戦闘外の編成画面で20枚の共通デッキを組み替えられます。</p><p><b>キャンペーン：</b>政策→選挙→政策の3戦。HPは各戦で回復。敗北時も所持カードは失いません。クリア後は所持品を引き継いで再攻略できます。</p><p><b>裏人脈：</b>強い効果と引き換えに負担カードが増えます。長引くほど危険です。</p></div><button class="btn primary" onclick="this.closest(\'dialog\').close()">閉じる</button>';d.showModal()}
try{let raw=localStorage.getItem('seikyoku-v1');if(raw){let old=JSON.parse(raw);if(old.state&&Array.isArray(old.state.deck)&&old.state.deck.every(id=>CARDS[id])){state=old.state;battle=old.battle;mode=old.mode;rewardStep=old.rewardStep||'';message=old.message||'';if(mode==='deck')mode=state.stage>=3?'complete':'map'}}}catch(e){}
render();
</script></body></html>
