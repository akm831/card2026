name: Godot Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['godot/**', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['godot/**', 'scripts/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_TOOL_DIR: ${{ github.workspace }}/.tools/godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify shared data and HTML regression
        run: |
          node scripts/export_godot_data.cjs --check
          node scripts/export_godot_fixtures.cjs
          npm test
      - name: Prepare Godot and Japanese font
        run: bash scripts/prepare_godot.sh --templates
      - name: Import, parity tests and UI smoke test
        run: |
          GODOT="$GODOT_TOOL_DIR/Godot_v4.6-stable_linux.x86_64"
          "$GODOT" --headless --path godot --editor --import --quit
          "$GODOT" --headless --path godot --script tests/test_engine.gd
          timeout 120 "$GODOT" --headless --path godot --script tests/test_ui.gd
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          python scripts/configure_android.py
      - name: Configure test signing
        env:
          TEST_KEY: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          TEST_USER: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          TEST_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/card2026-test.keystore"
          if [[ -n "$TEST_KEY" ]]; then
            [[ -n "$TEST_USER" && -n "$TEST_PASSWORD" ]] || { echo 'Set all three Android test-key secrets.'; exit 1; }
            printf '%s' "$TEST_KEY" | base64 --decode > "$key_path"
            printf 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=%s\n' "$TEST_USER" >> "$GITHUB_ENV"
            printf 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=%s\n' "$TEST_PASSWORD" >> "$GITHUB_ENV"
            echo 'SIGNING_MODE=stable-test-key' >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$key_path" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Card2026 Preview'
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
            echo 'SIGNING_MODE=temporary-preview-key' >> "$GITHUB_ENV"
            echo '::notice::Preview key changes each run. Configure Android test-key secrets to update without uninstalling.'
          fi
          chmod 600 "$key_path"
          printf 'GODOT_ANDROID_KEYSTORE_DEBUG_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
      - name: Export APK
        run: |
          mkdir -p build
          "$GODOT_TOOL_DIR/Godot_v4.6-stable_linux.x86_64" --headless --path godot --export-debug Android ../build/card2026-godot-preview.apk
          test -s build/card2026-godot-preview.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/card2026-godot-preview.apk
          printf 'Commit: %s\nSigning: %s\n' "$GITHUB_SHA" "$SIGNING_MODE" > build/BUILD_INFO.txt
          sha256sum build/card2026-godot-preview.apk > build/SHA256SUMS.txt
          printf 'APK signing: **%s**\n\nDownload the APK from this run’s Artifacts section.\n' "$SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: card2026-android-${{ github.run_number }}
          path: build/
          retention-days: 14
          if-no-files-found: error
